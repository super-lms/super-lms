<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitness Tracker — Sample Preview</title><style>body{margin:0;background:#f1f5f8;font-family:Arial,sans-serif}.sample-banner{padding:12px 28px;background:#e7eef6;font-weight:bold}a{color:#145c43}</style></head><body><div class="sample-banner">Sample preview — fictional students, no school records · <a href="?role=teacher">Teacher view</a> · <a href="?role=student">Student view</a></div><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{MemoryRouter}from'react-router-dom';import{AuthProvider,useAuth}from'/src/AuthContext.jsx';import FitnessTrackerPage from'/src/pages/FitnessTrackerPage.jsx';
const role=new URLSearchParams(location.search).get('role')==='student'?'student':'teacher';localStorage.setItem('super_lms_user',JSON.stringify({__v:'v3',id:role==='student'?101:3,name:'Sample User',email:'sample@example.test',role}));localStorage.setItem('super_lms_token','sample-preview-only');
const unit={id:1,course_id:1,title:'Four-Day Fitness Rotation',start_date:'2026-10-26',end_date:'2026-11-26',weekdays:[1,2,3,4],stations:[{name:'Back + Chest',instructions:'Follow the back and chest exercise plan demonstrated in class.'},{name:'Arms',instructions:'Use the arm exercise plan provided by your teacher.'},{name:'Shoulders',instructions:'Follow the shoulder exercise plan demonstrated in class.'},{name:'Legs',instructions:'Complete the leg exercise plan agreed with your teacher.'}],revision:0};
const students=['Alex Chen','Bella Li','Chris Wang','Dana Wu','Ethan Zhang','Fiona Liu','George Lin','Hana Xu','Isaac Sun','Jade Zhou','Kai Yang','Lily Zhao','Mason Hu'].map((name,i)=>({id:101+i,name,group_index:i===12?null:i%4,group_locked:false}));let records=[];const today='2026-10-26';let calendar=[];for(let t=Date.parse(unit.start_date);t<=Date.parse(unit.end_date);t+=86400000){let d=new Date(t),wd=d.getUTCDay()||7;if(wd<=4)calendar.push({date:d.toISOString().slice(0,10),weekday:wd,stations:[0,1,2,3].map(g=>(g+wd-1)%4)})}
const realFetch=window.fetch;window.fetch=async(input,options={})=>{let url=String(input);if(!url.includes('/api/fitness'))return realFetch(input,options);let path=new URL(url,location.href).pathname.replace('/api/fitness',''),body=options.body?JSON.parse(options.body):{};let result;if(path==='/courses')result={courses:[{id:1,title:'PE 11A — sample class'}],today};else if(path==='/courses/1/units')result={units:[unit]};else if(path==='/units/1/group'){students.find(s=>s.id===body.student_id).group_index=body.group_index;unit.revision++;result={success:true,revision:unit.revision}}else if(path==='/units/1/day'){for(let r of body.records){let old=records.find(x=>x.date===body.date&&x.student_id===r.student_id);if(old)old.completed=r.completed;else records.push({...r,date:body.date,station_index:calendar.find(d=>d.date===body.date).stations[students.find(s=>s.id===r.student_id).group_index]})}unit.revision++;result={success:true}}else if(path==='/units/1')result={unit,students:(role==='student'?students.filter(s=>s.id===101):students).map(s=>({...s,group_locked:records.some(r=>r.student_id===s.id&&r.completed)})),records:role==='student'?records.filter(r=>r.student_id===101):records,group_counts:[0,1,2,3].map(g=>students.filter(s=>s.group_index===g).length),calendar,today};else return new Response(JSON.stringify({error:'Sample preview supports the existing sample unit only.'}),{status:400,headers:{'Content-Type':'application/json'}});return new Response(JSON.stringify(result),{headers:{'Content-Type':'application/json'}})};
function Ready(){let{authReady}=useAuth();return authReady?React.createElement(FitnessTrackerPage):null}createRoot(document.getElementById('root')).render(React.createElement(MemoryRouter,null,React.createElement(AuthProvider,null,React.createElement(Ready))));
</script></body></html>
